
<!DOCTYPE html>

<body>
    <h1>Student Marks and Grade Calculator</h1>
    <p>Enter marks for three subjects (0 to 100).</p>

    <label for="subject1">Java:</label>
    <input type="number" id="subject1" min="0" max="100">
    <br><br>

    <label for="subject2">HTML:</label>
    <input type="number" id="subject2" min="0" max="100">
    <br><br>

    <label for="subject3">JavaScript:</label>
    <input type="number" id="subject3" min="0" max="100">
    <br><br>

    <button id="calculateButton">Calculate Result</button>

    <h2>Result</h2>
    <p id="output">Your result will appear here.</p>

    <script src="task3.js"></script>
</body>
